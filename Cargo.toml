[package]
name = "mysql_tui"
version = "0.1.0"
edition = "2024"
description = "A TUI MySQL client with connection management, SQL autocompletion and data export"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
mysql = { version = "26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
csv = "1"
serde_json = "1"
arboard = "3"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
unicode-width = "0.2"

[profile.release]
lto = true
